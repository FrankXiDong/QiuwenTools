name: 批量移动分类（中国各朝代→中国各时期）

on:
  workflow_dispatch: # 允许手动触发
    inputs:
      category:
        description: '需要处理的母分类名称（可带或不带 "Category:" 前缀）'
        required: true
        type: string
      sleep_time:
        description: '每次操作后的延时时间（毫秒）'
        required: false
        type: number
        default: 4000
      account_type:
        description: '使用的账号类型'
        required: false
        type: choice
        options:
          - bot
        default: 'bot'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 9

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run Bot Script
      env:
        # 使用 GitHub Secrets 存储敏感信息
        API_URL: ${{ secrets.API_URL }}
        BOT_USER_AGENT : ${{ secrets.BOT_USER_AGENT }}
        BOT_OAUTH2_CLIENT_ID: ${{ secrets.BOT_OAUTH2_CLIENT_ID }}
        BOT_OAUTH2_CLIENT_SECRET : ${{ secrets.BOT_OAUTH2_CLIENT_SECRET }}
        BOT_OAUTH2_ACCESS_TOKEN: ${{ secrets.BOT_OAUTH2_ACCESS_TOKEN }}
      run: |
        echo "=========================================="
        echo "开始执行批量移动分类任务"
        echo "目标分类: ${{ github.event.inputs.category }}"
        echo "延时时间: ${{ github.event.inputs.sleep_time }}ms"
        echo "账号类型: ${{ github.event.inputs.account_type }}"
        echo "=========================================="
        
        node task1.js \
          --category="${{ github.event.inputs.category }}"
      
      continue-on-error: false
